<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Q&A</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <aside class="side">
    <h1>Document Q&amp;A</h1>
    <p class="lede">Upload a PDF, then ask it questions. Answers are grounded only in what's on the page.</p>

    <div class="upload-box" id="dropZone">
      <input type="file" id="fileInput" accept="application/pdf" hidden>
      <p class="upload-label">Drop a PDF here or</p>
      <button id="browseBtn" class="btn-secondary">choose a file</button>
      <p id="uploadStatus" class="status"></p>
    </div>

    <div class="library">
      <div class="library-head">
        <span>In the store</span>
        <button id="resetBtn" class="btn-text">clear all</button>
      </div>
      <ul id="sourceList" class="source-list"><li class="empty">Nothing uploaded yet</li></ul>
    </div>

    <p class="api-note">Backend: <code id="apiBase">http://localhost:8000</code></p>
  </aside>

  <main class="chat">
    <div class="messages" id="messages">
      <div class="msg system">
        Upload a PDF on the left, then ask a question about it here.
      </div>
    </div>

    <form id="chatForm" class="composer">
      <input type="text" id="questionInput" placeholder="Ask something about the document..." autocomplete="off">
      <button type="submit" id="sendBtn">Ask</button>
    </form>
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
